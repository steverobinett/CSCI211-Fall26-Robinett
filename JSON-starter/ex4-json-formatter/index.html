<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 4: JSON Formatter</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>JSON Formatter</h1>

  <label for="jsonInput">Paste JSON here</label>
  <textarea id="jsonInput" rows="8"></textarea>

  <p>
    <button id="formatBtn">Format</button>
    <button id="minifyBtn">Minify</button>
  </p>

  <p id="errorMsg" class="error"></p>
  <p id="summary"></p>
  <pre id="output"></pre>
</body>
</html>
